
name: Build GTA V Trainer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GTA5AndroidTrainer-OpenIV-style-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: unzip GTA5AndroidTrainer-OpenIV-style-source.zip

      - name: Build APK
        run: |
          cd GTA5AndroidTrainer
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: GTA5AndroidTrainer-APK
          path: GTA5AndroidTrainer/app/build/outputs/apk/debug/app-debug.apk
